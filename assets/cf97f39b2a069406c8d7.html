<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI 灵感画集 · 风格轮播</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#292929;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#202020}.phone{position:relative;width:min(100vw,375px);height:min(216.533vw,812px);overflow:hidden;background:radial-gradient(circle at 82% 14%,rgba(255,255,255,.94) 0 5%,transparent 24%),radial-gradient(circle at 22% 4%,#f7d886 0,transparent 34%),linear-gradient(145deg,#fff8e8 0,#fffdfa 56%,#fff1d9 100%)}.status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:3px 21px 0;font-size:14px;font-weight:500}.signal{font-size:13px;letter-spacing:-2px}.nav{height:56px;display:grid;grid-template-columns:72px 1fr 72px;align-items:center;padding:0 14px}.back,.help{height:32px;border:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.35);display:grid;place-items:center}.back{width:32px;border-radius:8px;font-size:24px;font-weight:300}.help{border-radius:16px;font-size:13px;font-weight:500}.title{text-align:center;font-size:16px;font-weight:600}.content{padding:12px 14px 0}.hero{height:178px;border-radius:8px 8px 0 0;background:radial-gradient(ellipse 158px 76px at 52% 100%,rgba(225,202,149,.28),transparent 72%),#fffef8;box-shadow:inset 0 0 0 1px rgba(221,192,122,.12);overflow:hidden;position:relative;touch-action:pan-y;user-select:none}.tape{position:absolute;left:13px;top:5px;width:63px;height:57px;object-fit:cover;z-index:40}.copy{display:none}.copy b{display:block;font-size:22px;line-height:1.25}.copy p{font-size:13px;line-height:1.55;color:#888;margin:8px 0 12px}.tag{display:inline-flex;align-items:center;gap:5px;max-width:118px;padding:6px 9px;border-radius:12px;background:#fff3d8;color:#9b6e26;font-size:11px;font-weight:600;white-space:nowrap;transition:.25s}.spark{position:absolute;display:block;object-fit:contain;pointer-events:none;z-index:35}.spark-left{left:9px;top:83px;width:20px;height:20px}.spark-right{left:307px;top:138px;width:16px;height:31px}.deck{position:absolute;left:0;top:18px;width:347px;height:154px}.card{--x:0px;--y:0px;--r:0deg;--s:1;position:absolute;left:50%;top:6px;width:100px;height:130px;padding:0 0 7px;background:#fff;box-shadow:0 6px 16px rgba(95,69,25,.15);transform:translateX(calc(-50% + var(--x))) translateY(var(--y)) rotate(var(--r)) scale(var(--s));border-radius:8px;transition:transform .45s cubic-bezier(.22,.82,.2,1),opacity .23s,filter .31s;transform-origin:50% 50%;overflow:hidden;will-change:transform}.card img{width:100%;height:100px;display:block;object-fit:cover;border-radius:8px 8px 0 0;transform:scale(1.04)}.card::after{content:attr(data-short);position:absolute;bottom:6px;left:0;width:100%;text-align:center;font-size:10px;line-height:16px;color:#777;transition:color .35s}.card.is-active::after{color:#666}.dots{display:none}.dot{width:4px;height:4px;border-radius:99px;background:#d5d0c8;transition:.25s}.dot.on{width:14px;background:#e8b94f}.info{height:90px;background:rgba(255,255,255,.78);border-radius:0 0 8px 8px;padding:16px;position:relative}.info h2{font-size:14px;margin:0 0 2px}.info p{font-size:12px;color:#999;margin:0;line-height:1.5}.toggle{position:absolute;right:14px;top:34px;width:39px;height:22px;border-radius:20px;background:#1fd6a2}.toggle::after{content:"";position:absolute;width:18px;height:18px;right:2px;top:2px;border-radius:50%;background:white}.material{margin-top:12px;background:rgba(255,255,255,.76);border-radius:12px;padding:20px 18px}.material b{display:block;font-size:17px;margin-bottom:5px}.material span{font-size:13px;color:#999}.chev{float:right;font-size:24px;color:#ccc}.section-title{font-size:18px;font-weight:700;margin:28px 14px 14px}.result{margin:0 0 20px;height:280px;border-radius:12px;overflow:hidden;position:relative;background:#eee}.result img{width:100%;height:100%;object-fit:cover;object-position:center 44%}.result::after{content:"生成日期 · 2026.5.20";position:absolute;right:12px;bottom:12px;color:#fff;font-size:13px;text-shadow:0 1px 5px #333}.hint{display:none}.screen{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:fill;pointer-events:none;z-index:0}.status,.nav,.info,.material,.section-title,.result{display:none}.content{padding:0}.hero{position:absolute;left:14px;top:112px;width:347px;height:178px;z-index:1}@media(max-width:374px){.phone{height:216.533vw}}
</style>
</head>
<body>
<main class="phone">
  <img class="screen" src="../assets/e74c7320243d37921837.webp" alt="">
  <div class="status"><span>9:41</span><span class="signal">▮▮▮ ))) ▰</span></div>
  <nav class="nav"><button class="back" aria-label="返回">‹</button><div class="title">AI灵感画集</div><button class="help">使用说明</button></nav>
  <div class="content">
    <section class="hero" id="hero">
      <img class="tape" src="../assets/2f6a211a24c27bab8035.webp" alt="Today">
      <div class="copy"><b>8 种画风</b><p>同一天<br>不同的样子</p><span class="tag" id="tag">✦ 家庭日漫</span></div>
      <img class="spark spark-left" src="../assets/bf3965209706397a54fa.bin" alt=""><img class="spark spark-right" src="../assets/da46353aad9fd1318d20.bin" alt=""><div class="hint">左右滑动</div>
      <div class="deck" id="deck"></div><div class="dots" id="dots"></div>
    </section>
    <div class="info"><h2>AI灵感画集</h2><p>眼镜自动拍摄高光时刻记录每一天，生成你的<br>专属AI灵感画集</p><div class="toggle"></div></div>
    <div class="material"><span class="chev">›</span><b>画集素材</b><span>包含近10天图像素材，用于生成AI灵感画集</span></div>
    <div class="section-title">AI灵感画集</div>
    <div class="result"><img src="../assets/c90476c2cf0053074564.webp" alt="已生成画集"></div>
  </div>
</main>
<script>
const styles=[
 ['Q版贴纸','贴纸','../assets/50ac8338d38473bfe420.webp'],['家庭日漫','日漫','../assets/c90476c2cf0053074564.webp'],['复古像素','像素','../assets/def6daa4c2ce1c420a4f.webp'],['萌趣粘土','粘土','../assets/3cec212eecdea202a6e3.webp'],
 ['治愈水彩','水彩','../assets/8e26dbae7796e4b70cb8.webp'],['旅行手帐','手帐','../assets/e9a61b5856f9d014535e.webp'],['美漫风','美漫','../assets/1f4c1a830c907f3ab68b.webp']
];
let active=2,startX=0,timer;
const deck=document.querySelector('#deck'),dots=document.querySelector('#dots'),tag=document.querySelector('#tag'),hero=document.querySelector('#hero');
styles.forEach((s,i)=>{const c=document.createElement('div');c.className='card';c.dataset.short=s[0];c.innerHTML=`<img src="${s[2]}" alt="${s[0]}">`;c.addEventListener('click',()=>i===active?restart():go(i));deck.append(c);const d=document.createElement('i');d.className='dot';dots.append(d)});
function render(){const cards=[...deck.children];cards.forEach((c,i)=>{let d=(i-active+styles.length)%styles.length;if(d>styles.length/2)d-=styles.length;const ad=Math.abs(d);let x=0,y=0,r=0,s=1;if(d===-1){x=-45;y=2.5;r=-14;s=.9}else if(d===1){x=52;y=1.5;r=12;s=.9}else if(d===-2){x=-85.5;y=13;r=-22;s=.81}else if(d===2){x=95.5;y=13;r=22;s=.81}else if(ad>2){x=d<0?-136:142;y=52;r=d<0?-26:26;s=.7}c.style.setProperty('--x',`${x}px`);c.style.setProperty('--y',`${y}px`);c.style.setProperty('--r',`${r}deg`);c.style.setProperty('--s',s);c.style.zIndex=30-ad;c.style.opacity=ad>2?'0':String(1-ad*.06);c.style.filter=ad===0?'none':'saturate(.96)';c.classList.toggle('is-active',ad===0)});[...dots.children].forEach((d,i)=>d.classList.toggle('on',i===active));tag.textContent='✦ '+styles[active][0]}
function go(n){active=(n+styles.length)%styles.length;render();restart()}
function restart(){clearInterval(timer);timer=setInterval(()=>go(active+1),2800)}
hero.addEventListener('pointerdown',e=>{startX=e.clientX;hero.setPointerCapture(e.pointerId);clearInterval(timer)});hero.addEventListener('pointerup',e=>{const dx=e.clientX-startX;if(Math.abs(dx)>24)go(active+(dx<0?1:-1));else restart()});
render();restart();
</script>
</body>
</html>
